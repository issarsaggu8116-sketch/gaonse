# ==============================================================
# NGINX REVERSE PROXY CONFIGURATION FOR GAON SE PRODUCTION VPS
# Place in: /etc/nginx/sites-available/gaonse
# Symlink to: /etc/nginx/sites-enabled/gaonse
# ==============================================================

# 1. Customer API (api.gaonse.in -> Port 4000)
server {
    listen 80;
    server_name api.gaonse.in;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Support for Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

